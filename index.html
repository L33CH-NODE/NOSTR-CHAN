<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOSTRchan - Anonymous Nostr Feed</title>
  <script src="https://unpkg.com/nostr-tools@1.17.0/lib/nostr.bundle.js"></script>
  <script src="https://unpkg.com/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px;
    }
    header {
      text-align: center;
      padding: 24px 0 16px;
      border-bottom: 1px solid #333;
      margin-bottom: 16px;
    }
    header h1 {
      color: #7b68ee;
      font-size: 1.8em;
      letter-spacing: 2px;
    }
    header p {
      color: #888;
      font-size: 0.85em;
      margin-top: 4px;
    }

    /* Post form */
    .post-form {
      background: #16213e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .post-form textarea {
      width: 100%;
      background: #1a1a2e;
      border: 1px solid #444;
      border-radius: 6px;
      color: #e0e0e0;
      padding: 12px;
      font-size: 0.95em;
      resize: vertical;
      min-height: 80px;
      font-family: inherit;
    }
    .post-form textarea:focus {
      outline: none;
      border-color: #7b68ee;
    }
    .post-form textarea::placeholder { color: #666; }
    .form-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .char-count { color: #666; font-size: 0.8em; }
    .post-btn {
      background: #7b68ee;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 24px;
      font-size: 0.95em;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .post-btn:hover { background: #6a5acd; }
    .post-btn:disabled { background: #444; color: #888; cursor: not-allowed; }

    /* Feed */
    .feed { display: flex; flex-direction: column; gap: 8px; }
    .msg {
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 14px 16px;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .msg-text {
      font-size: 0.95em;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .msg-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 0.75em;
      color: #666;
    }
    .msg-anon { color: #7b68ee; font-weight: 600; }
    .msg-img {
      max-width: 100%;
      max-height: 400px;
      border-radius: 6px;
      margin-top: 8px;
      cursor: pointer;
    }

    /* Status bar */
    .status-bar {
      text-align: center;
      padding: 8px;
      font-size: 0.8em;
      color: #666;
    }
    .status-bar .connected { color: #4caf50; }
    .status-bar .error { color: #f44336; }

    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      z-index: 100;
      display: none;
      font-size: 0.9em;
    }
    .toast.success { background: #4caf50; color: #fff; }
    .toast.error { background: #f44336; color: #fff; }

    /* Loading */
    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
    .loading::after {
      content: '';
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #666;
      border-top-color: #7b68ee;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Image upload */
    .img-upload-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .img-upload-label {
      background: #1a1a2e;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.85em;
      cursor: pointer;
      color: #aaa;
      transition: border-color 0.2s;
    }
    .img-upload-label:hover { border-color: #7b68ee; color: #e0e0e0; }
    .img-upload-name { font-size: 0.8em; color: #888; }

    /* Settings toggle */
    .settings-toggle {
      background: none;
      border: 1px solid #333;
      color: #888;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8em;
      cursor: pointer;
      float: right;
    }
    .settings-toggle:hover { color: #e0e0e0; border-color: #7b68ee; }
    .settings-panel {
      background: #16213e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      display: none;
    }
    .settings-panel h3 { color: #7b68ee; margin-bottom: 10px; font-size: 0.95em; }
    .settings-panel textarea {
      width: 100%;
      background: #1a1a2e;
      border: 1px solid #444;
      border-radius: 6px;
      color: #e0e0e0;
      padding: 8px;
      font-size: 0.85em;
      min-height: 100px;
      font-family: monospace;
    }
    .settings-panel label { display: block; color: #aaa; font-size: 0.85em; margin-bottom: 4px; }
    .settings-panel button {
      background: #7b68ee;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 0.85em;
      cursor: pointer;
      margin-top: 8px;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>NOSTRchan</h1>
      <p>anonymous nostr message feed</p>
    </header>

    <button class="settings-toggle" onclick="toggleSettings()">relays</button>
    <div style="clear:both"></div>

    <div class="settings-panel" id="settings-panel">
      <h3>Relay Configuration</h3>
      <label>Relays (one per line)</label>
      <textarea id="relay-list"></textarea>
      <button onclick="saveRelays()">Save</button>
      <button onclick="resetRelays()">Reset Defaults</button>
    </div>

    <div class="post-form">
      <textarea id="msg-input" placeholder="Post something anonymous..." maxlength="1000"></textarea>
      <div class="img-upload-row">
        <label class="img-upload-label">
          attach image
          <input type="file" id="msg-image" accept="image/*" style="display:none" onchange="updateFileName()">
        </label>
        <span class="img-upload-name" id="file-name"></span>
      </div>
      <div class="form-footer">
        <span class="char-count" id="char-count">0/1000</span>
        <button class="post-btn" id="post-btn" onclick="postMessage()">Post Anonymously</button>
      </div>
    </div>

    <div class="status-bar" id="status">Connecting...</div>

    <div id="loading" class="loading" style="display:none">Loading feed</div>
    <div class="feed" id="feed"></div>

    <div class="toast" id="toast"></div>
  </div>

  <script>
    // ── Shared anonymous identity ──
    // Everyone posts from this single keypair. The private key is public on purpose.
    const ANON_PRIVKEY = '07662af3b7e87f9b6c88764e8ec0578a909e675b3b6ad1961a2bfb150630fa93';
    const ANON_PUBKEY = NostrTools.getPublicKey(ANON_PRIVKEY);

    // ── Relays ──
    const DEFAULT_RELAYS = [
      'wss://relay.damus.io',
      'wss://nos.lol',
      'wss://relay.snort.social',
      'wss://relay.primal.net',
      'wss://nostr.fmt.wiz.biz',
      'wss://offchain.pub',
      'wss://nostr-pub.wellorder.net'
    ];

    let RELAYS = loadRelays();
    let pool = null;
    let currentSub = null;
    const seenIds = new Set();

    function loadRelays() {
      try {
        const saved = localStorage.getItem('nostrchan_relays');
        if (saved) {
          const list = JSON.parse(saved);
          if (Array.isArray(list) && list.length) return list;
        }
      } catch {}
      return DEFAULT_RELAYS.slice();
    }

    // ── UI helpers ──
    function toast(msg, type = 'success') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast ' + type;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 3000);
    }

    function setStatus(msg, cls = '') {
      const el = document.getElementById('status');
      el.innerHTML = cls ? `<span class="${cls}">${msg}</span>` : msg;
    }

    function updateFileName() {
      const file = document.getElementById('msg-image').files[0];
      document.getElementById('file-name').textContent = file ? file.name : '';
    }

    // Character counter
    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('msg-input');
      const counter = document.getElementById('char-count');
      input.addEventListener('input', () => {
        counter.textContent = `${input.value.length}/1000`;
      });
    });

    // ── Image upload via nostr.build ──
    async function uploadImage(file) {
      const form = new FormData();
      form.append('file', file);
      const res = await fetch('https://nostr.build/api/v2/upload/files', { method: 'POST', body: form });
      if (!res.ok) throw new Error('Image upload failed');
      const data = await res.json();
      const url = data?.data?.[0]?.url;
      if (!url) throw new Error('No URL returned from image host');
      return url;
    }

    // ── Connect to relays ──
    async function connect() {
      pool = new NostrTools.SimplePool();
      const results = await Promise.allSettled(RELAYS.map(r => pool.ensureRelay(r)));
      const ok = results.filter(r => r.status === 'fulfilled').length;
      if (ok === 0) {
        setStatus('Failed to connect to any relay', 'error');
        return false;
      }
      setStatus(`Connected to ${ok}/${RELAYS.length} relays`, 'connected');
      return true;
    }

    // ── Subscribe to the feed ──
    function subscribeFeed() {
      if (currentSub) { currentSub.unsub(); currentSub = null; }

      document.getElementById('loading').style.display = 'block';
      const feed = document.getElementById('feed');
      feed.innerHTML = '';
      seenIds.clear();

      let initialEvents = [];

      currentSub = pool.sub(RELAYS, [{
        kinds: [1],
        authors: [ANON_PUBKEY],
        limit: 50
      }]);

      currentSub.on('event', ev => {
        if (seenIds.has(ev.id)) return;
        seenIds.add(ev.id);
        initialEvents.push(ev);
      });

      currentSub.on('eose', () => {
        document.getElementById('loading').style.display = 'none';
        // Sort newest first and render
        initialEvents.sort((a, b) => b.created_at - a.created_at);
        initialEvents.forEach(ev => renderMessage(ev, 'append'));

        if (initialEvents.length === 0) {
          feed.innerHTML = '<div style="text-align:center;color:#666;padding:20px;">No messages yet. Be the first to post!</div>';
        }

        // Live updates after initial load
        currentSub.on('event', ev => {
          if (seenIds.has(ev.id)) return;
          seenIds.add(ev.id);
          // Clear the "no messages" placeholder if present
          const placeholder = feed.querySelector('div[style]');
          if (placeholder && placeholder.textContent.includes('No messages')) {
            placeholder.remove();
          }
          renderMessage(ev, 'prepend');
        });
      });
    }

    // ── Render a message ──
    function renderMessage(ev, mode = 'append') {
      const feed = document.getElementById('feed');
      const div = document.createElement('div');
      div.className = 'msg';
      div.id = 'msg-' + ev.id;

      // Check for image tag
      const imgTag = ev.tags.find(t => t[0] === 'image');
      const imgHtml = imgTag ? `<img class="msg-img" src="${DOMPurify.sanitize(imgTag[1])}" onclick="window.open(this.src,'_blank')" alt="attached image">` : '';

      const time = new Date(ev.created_at * 1000);
      const timeStr = time.toLocaleString();
      const idShort = ev.id.substring(0, 8);

      div.innerHTML = `
        <div class="msg-text">${DOMPurify.sanitize(ev.content)}</div>
        ${imgHtml}
        <div class="msg-meta">
          <span class="msg-anon">Anonymous</span>
          <span title="${ev.id}">#${idShort} &middot; ${timeStr}</span>
        </div>
      `;

      if (mode === 'prepend') {
        feed.prepend(div);
      } else {
        feed.appendChild(div);
      }
    }

    // ── Post a message ──
    async function postMessage() {
      const input = document.getElementById('msg-input');
      const imageInput = document.getElementById('msg-image');
      const btn = document.getElementById('post-btn');
      const content = input.value.trim();
      const imageFile = imageInput.files[0];

      if (!content && !imageFile) {
        toast('Write something or attach an image', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Posting...';

      try {
        const tags = [['t', 'nostrchan']];

        // Upload image if attached
        if (imageFile) {
          btn.textContent = 'Uploading image...';
          const url = await uploadImage(imageFile);
          tags.push(['image', url]);
        }

        // Build and sign event with shared key
        const event = {
          kind: 1,
          pubkey: ANON_PUBKEY,
          created_at: Math.floor(Date.now() / 1000),
          tags: tags,
          content: content
        };

        const signed = NostrTools.finalizeEvent(event, ANON_PRIVKEY);

        // Publish to all relays
        const pubs = pool.publish(RELAYS, signed);
        const results = await Promise.allSettled(pubs);
        const ok = results.filter(r => r.status === 'fulfilled').length;

        if (ok > 0) {
          toast(`Posted to ${ok} relay${ok > 1 ? 's' : ''}`);
          input.value = '';
          imageInput.value = '';
          document.getElementById('file-name').textContent = '';
          document.getElementById('char-count').textContent = '0/1000';
        } else {
          throw new Error('No relays accepted the message');
        }
      } catch (e) {
        console.error('Post failed:', e);
        toast('Failed: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Post Anonymously';
      }
    }

    // ── Settings ──
    function toggleSettings() {
      const panel = document.getElementById('settings-panel');
      const open = panel.style.display !== 'none' && panel.style.display !== '';
      panel.style.display = open ? 'none' : 'block';
      if (!open) {
        document.getElementById('relay-list').value = RELAYS.join('\n');
      }
    }

    function saveRelays() {
      const raw = document.getElementById('relay-list').value;
      const list = raw.split(/[\n,\s]+/).map(s => s.trim()).filter(s => s.startsWith('wss://'));
      if (list.length === 0) {
        toast('Need at least one relay', 'error');
        return;
      }
      RELAYS = [...new Set(list)];
      localStorage.setItem('nostrchan_relays', JSON.stringify(RELAYS));
      toast('Relays saved - reconnecting...');
      toggleSettings();
      init();
    }

    function resetRelays() {
      RELAYS = DEFAULT_RELAYS.slice();
      localStorage.removeItem('nostrchan_relays');
      document.getElementById('relay-list').value = RELAYS.join('\n');
      toast('Reset to defaults - reconnecting...');
      toggleSettings();
      init();
    }

    // ── Init ──
    async function init() {
      if (currentSub) { currentSub.unsub(); currentSub = null; }
      setStatus('Connecting...');
      const ok = await connect();
      if (ok) subscribeFeed();
    }

    window.onload = init;
  </script>
</body>
</html>
